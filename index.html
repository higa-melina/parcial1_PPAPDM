<!doctype html>
<html lang="es">
  <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" href="img/favicon.png">
      <title>Filmory | Registro de Películas</title>

      <link rel="stylesheet" href="css/estilos.css" />
      <script src="scripts/vue3.js"></script>
  </head>

  <body>
    <div id="app" v-cloak>
      <div class="layout">
        <div class="left"></div>

        <div class="right">
          <div class="contenedor">
            <h1>{{ titulo }}</h1>
            <h2>{{ subtitulo }}</h2>

            <mi-formulario @agregar-pelicula="peliculas.push($event)">
            </mi-formulario>
          </div>
        </div>
      </div>

      <div class="contenedorPeliculas">
        <lista-peliculas
          :peliculas="peliculas"
          @empezar-drag="empezarDrag"
          @cambiar-estado="cambiarEstado"
          @eliminar-pelicula="eliminarPelicula"
          @guardar-edicion="actualizarPelicula"
        >
        </lista-peliculas>

        <recomendaciones-peliculas
          :recomendaciones="peliculasRecomendadas"
          @agregar-recomendacion="agregarRecomendacionDirecta"
        >
        </recomendaciones-peliculas>
      </div>      
    </div>

    <script src="scripts/app.js"></script>
  </body>
</html>
